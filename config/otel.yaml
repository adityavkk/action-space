receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  batch:
    timeout: 2s
    send_batch_size: 256
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      {
        receivers: [otlp],
        processors: [memory_limiter, batch],
        exporters: [debug],
      }
    logs:
      {
        receivers: [otlp],
        processors: [memory_limiter, batch],
        exporters: [debug],
      }
    metrics:
      {
        receivers: [otlp],
        processors: [memory_limiter, batch],
        exporters: [debug],
      }
